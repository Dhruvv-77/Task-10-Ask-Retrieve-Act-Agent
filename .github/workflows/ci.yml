name: Capstone CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: capstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r mcp-server/requirements.txt

      - name: Ingest Knowledge Base
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/capstone
          REDIS_URL: redis://localhost:6379
        run: |
          python apps/api/rag/ingest.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/capstone
          REDIS_URL: redis://localhost:6379
          MCP_SERVER_URL: http://localhost:9000
        run: |
          cd apps/api
          pytest tests/ -v

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm install

      - name: Build Next.js Application
        run: |
          cd apps/web
          npm run build
